name: CI

# PRs live on psu-edu, where Actions is disabled; runs come from pushes to the CI mirror.
on:
  push:
  pull_request:

# The token only needs to read the code. Stated here so it does not depend on a repo setting.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A stuck database connection must fail the run, not hold it for the 6-hour default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: week-06-devops/backend
    services:
      postgres:
        image: postgres:17-alpine
        # Throwaway credentials for a container that lives only as long as this job.
        env:
          POSTGRES_USER: sweng861
          POSTGRES_PASSWORD: sweng861
          POSTGRES_DB: sweng861_week6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweng861"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without it the database-backed tests skip and coverage drops below the gate.
      TEST_DATABASE_URL: postgresql+psycopg://sweng861:sweng861@localhost:5432/sweng861_week6_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: week-06-devops/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      # The 80% threshold lives in .coveragerc, so this line and a local run use the same gate.
      - run: pytest --cov=.

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: week-06-devops/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Matches the Node used for local development; package.json engines allows 22.18+.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week-06-devops/frontend/package-lock.json
      # No package needs an install script on Linux, so none gets to run one.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # The 80% thresholds live in vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Pinned like every other dependency: an unpinned scanner changes under the gate it enforces.
      - name: Audit backend dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r week-06-devops/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Blocks on what ships: the runtime image holds only dist/, so dev tooling never reaches it.
      - name: Audit frontend runtime dependencies
        working-directory: week-06-devops/frontend
        run: npm audit --omit=dev --audit-level=high
      # Kept visible without blocking: braces (GHSA-vfj7-8cjw-p6xm) reaches only the lint config and has no fix.
      - name: Audit all frontend dependencies (report only)
        working-directory: week-06-devops/frontend
        run: npm audit --audit-level=high
        continue-on-error: true
      # Any .env variant counts (.env.local, .env.production); only the placeholder template is allowed.
      - name: Check that no .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "A .env file is committed"; exit 1
          fi

  package:
    # No image is built from code that failed lint, tests or the dependency audit.
    needs: [backend, frontend, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: sweng861-week6-backend
      FRONTEND_IMAGE: sweng861-week6-frontend
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Same context and Dockerfile as docker-compose.yml, so CI builds what compose runs.
      - name: Build the backend image
        run: >-
          docker build -f week-06-devops/backend/Dockerfile
          -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:week6" week-06-devops
      # A build can succeed on an image that cannot start; /health/live needs no config or database.
      - name: Smoke-test the image
        run: |
          docker run -d --rm --name smoke -p 8000:8000 "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health/live && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id "$IMAGE:$GITHUB_SHA" -u)" != "0"
      # Same tag scheme as the backend; its own context, since week-06-devops/.dockerignore drops frontend/.
      - name: Build the frontend image
        run: >-
          docker build -t "$FRONTEND_IMAGE:$GITHUB_SHA" -t "$FRONTEND_IMAGE:week6"
          week-06-devops/frontend
      # The root and a history-mode route must both return the app, or a reload would 404.
      - name: Smoke-test the frontend image
        run: |
          docker run -d --rm --name web -p 8080:8080 "$FRONTEND_IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q 'id="app"'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/coverages/1 | grep -q 'id="app"'
      # `if`, not `! cmd`: bash -e does not stop on a failed negation, so that line could never fail.
      - name: Check the frontend image runs as non-root and carries no Node
        run: |
          test "$(docker run --rm --entrypoint id "$FRONTEND_IMAGE:$GITHUB_SHA" -u)" != "0"
          if docker run --rm --entrypoint sh "$FRONTEND_IMAGE:$GITHUB_SHA" -c 'command -v node'; then
            echo "Node is in the runtime image"; exit 1
          fi
      # A pinned image, not a third-party action on a moving ref: the scanner gets the Docker socket.
      # --ignore-unfixed: a finding with no patched package cannot be fixed by this build.
      - name: Scan both images for vulnerabilities and secrets
        run: |
          status=0
          for image in "$IMAGE:$GITHUB_SHA" "$FRONTEND_IMAGE:$GITHUB_SHA"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "$image" || status=1  # scan the second image even when the first fails
          done
          exit "$status"

  alert-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The image compose runs, so promtool here and Prometheus there read rules the same way.
      PROMETHEUS_IMAGE: prom/prometheus:v3.13.4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Mounted where compose mounts it, so the rule_files glob is checked too: a glob that
      # matches nothing still passes promtool, with zero rules loaded.
      - name: Check the Prometheus config and every rule file it loads
        run: |
          set -o pipefail  # without it, tee's exit status would hide a promtool failure
          docker run --rm --entrypoint promtool \
            -v "$PWD/week-06-devops/observability/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml | tee check.log
          grep -Eq "SUCCESS: [1-9][0-9]* rule files found" check.log
      - name: Run the alert rule tests
        run: |
          docker run --rm --entrypoint sh -w /etc/prometheus/tests \
            -v "$PWD/week-06-devops/observability/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" -c 'promtool test rules *.test.yml'
