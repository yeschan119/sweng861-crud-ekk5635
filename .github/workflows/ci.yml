name: CI

# PRs live on psu-edu, where Actions is disabled; runs come from pushes to the CI mirror.
on:
  push:
  pull_request:

# The token only needs to read the code. Stated here so it does not depend on a repo setting.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A stuck database connection must fail the run, not hold it for the 6-hour default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: week-06-devops/backend
    services:
      postgres:
        image: postgres:17-alpine
        # Throwaway credentials for a container that lives only as long as this job.
        env:
          POSTGRES_USER: sweng861
          POSTGRES_PASSWORD: sweng861
          POSTGRES_DB: sweng861_week6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweng861"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without it 46 tests skip and coverage drops below the gate.
      TEST_DATABASE_URL: postgresql+psycopg://sweng861:sweng861@localhost:5432/sweng861_week6_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: week-06-devops/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      # The 80% threshold lives in .coveragerc, so this line and a local run use the same gate.
      - run: pytest --cov=.
