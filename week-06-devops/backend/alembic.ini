# Alembic configuration. Trimmed from `alembic init` to the settings this
# service actually uses.
#
# There is deliberately no sqlalchemy.url here: alembic/env.py reads
# DATABASE_URL through the application's own settings, so a migration cannot
# run against a different database than the service.

[alembic]
script_location = %(here)s/alembic

# Puts this directory on sys.path so env.py can import config and models.
prepend_sys_path = .

path_separator = os


# --- logging -----------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
