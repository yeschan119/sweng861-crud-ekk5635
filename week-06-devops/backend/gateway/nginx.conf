# The API gateway.
#
# Everything a client sends arrives here first and is passed to the API over
# the compose network. The API stops publishing a host port at all, which is
# what the Advanced Features section means by managing requests and responses:
# there is one door, and the rules about what comes through it are stated in
# one file rather than repeated in every handler.
#
# It also settles what #17 could not. A second copy of the API could not start
# there because two containers cannot bind one host port. Nothing behind this
# proxy binds a host port, so `up --scale api=2` works and Nginx balances
# across whatever is running.
#
# AI use: drafted with Claude and verified against the running stack.

server {
    listen 80;
    server_name _;

    # Drops the version from the Server header and from error pages, leaving
    # "nginx" rather than "nginx/1.29.1". The version is the part worth hiding:
    # it is what turns "there is a proxy" into a list of advisories to try. The
    # same argument the 422 handler makes about naming its validation library.
    server_tokens off;

    # A body larger than this is refused here rather than after it has been
    # read into the application. The largest request this API accepts is a
    # coverage with a description; a megabyte is generous for that and small
    # enough that a flood of oversized bodies cannot be spent on upstream
    # memory.
    client_max_body_size 1m;

    # Docker's embedded DNS. Nginx resolves a name inside an upstream block, or
    # a literal name in proxy_pass, exactly once when it starts, and keeps that
    # address for the life of the process. Compose hands out a new address to
    # every replica, so a proxy configured the obvious way sends everything to
    # whichever container existed first and silently ignores the rest. Measured
    # before this was written: with three replicas running and DNS returning
    # all three addresses, twelve requests went twelve times to api-1.
    #
    # Naming the resolver and putting the upstream in a variable moves the
    # lookup to request time, and `valid` caps how long an answer is reused, so
    # a replica that appears or disappears is picked up within that window.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        # proxy_pass with a variable does not append the matched URI the way a
        # literal one does, so the request path is passed explicitly. Without
        # $request_uri every request would arrive at the API as "/".
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;

        # Without these the application sees every request as coming from the
        # gateway's address on the internal network. The rate limiter carried
        # over from Week 2 counts per address, so it would count the whole
        # world as one caller and rate-limit everybody together the moment one
        # client misbehaved.
        #
        # The application does not trust these blindly. X-Forwarded-For is
        # client-settable, and Week 2 deliberately reads the connection address
        # instead; wiring the app to read the header is a decision for whoever
        # configures the deployment to trust this proxy, and it is written down
        # in the README rather than assumed here.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A collection reaches out to SEC and the client budget there is
        # fifteen seconds. A read timeout shorter than that would have the
        # gateway give up on a request the API is still working on, and answer
        # 504 for a collection that was about to succeed.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Answered here, so a caller sees this API's error shape rather than
        # Nginx's HTML page when the upstream is missing or slow. The body is
        # the same {"error", "message"} contract every other failure uses.
        proxy_intercept_errors on;
        error_page 502 503 504 = @upstream_down;
    }

    location @upstream_down {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"error":"Service Unavailable","message":"The API is not reachable. Try again shortly."}';
    }

    # The gateway's own liveness, answered without touching the API. A probe
    # against / would report the gateway unhealthy whenever the API was down,
    # which is the one moment an operator needs to tell the two apart.
    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","component":"gateway"}';
    }
}
