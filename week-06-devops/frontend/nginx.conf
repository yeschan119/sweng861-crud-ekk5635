server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # History-mode routes (/coverages/3) are the app's, not files: hand them to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets carry a content hash in their name, so they never change in place.
    # One header, not `expires` as well: that would send Cache-Control twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the current assets, so it must be revalidated on every load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
